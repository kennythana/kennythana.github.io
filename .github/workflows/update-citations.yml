name: Update citations

on:
  schedule:
    - cron: "17 13 * * 1"   # every Monday, ~9am Boston time
  workflow_dispatch:         # lets you press "Run workflow" by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python scripts/update_scholar.py
        env:
          SCHOLAR_ID: ${{ vars.SCHOLAR_ID }}
      - name: Commit if numbers changed
        run: |
          if git diff --quiet stats.json; then
            echo "No change."
          else
            git config user.name "citation-bot"
            git config user.email "citation-bot@users.noreply.github.com"
            git add stats.json
            git commit -m "Update citation counts"
            git push
          fi
